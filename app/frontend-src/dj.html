<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ</title>
    <style>
        /* Dark theme, like the scoreboard and judge pages */
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #111;
            color: white;
            margin: 1em;
        }
        h2, h3 { margin: 0.4em 0; }
        h3 { color: rgb(192, 192, 106); }
        button {
            padding: 0.6em 1em;
            color: white;
            font-size: medium;
            border: 1px solid #777;
            border-radius: 10px;
            margin: 10px 10px 10px 0;
            background-color: #5c5957;
            cursor: pointer;
        }
        button:hover:not(:disabled) { background-color: #77736f; }
        button:disabled { opacity: 0.4; cursor: default; }
        /* The competition / session button is the one the DJ must not miss */
        #begin {
            display: block;
            background-color: orange;
            color: #111;
            font-weight: bold;
            font-size: 1.4em;
            padding: 0.8em 1.4em;
        }
        #begin[hidden] { display: none; }
        #status { color: orange; font-size: 1.2em; }
        #connection, #audioStatus { color: #aaa; }
        table { border-collapse: collapse; }
        th, td { padding: 8px 12px; border-bottom: 1px solid #444; text-align: left; }
        th { background-color: #3c3b3b; border-bottom: 1px solid white; }
        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.7);
            padding-top: 60px;
        }
        .modal-content {
            background-color: #333;
            color: white;
            margin: 5% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
        }
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }
        .close:hover,
        .close:focus {
            color: white;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2 id="festivalName" class="control"></h2>
    <h2 id="currentCompetition" class="control"></h2>
    <h2 id="currentCompetitor" class="control"></h2>
    <button id="begin" class="control" hidden></button>
    <div>
    <button id="unlock" class="control">Enable audio</button>
    <button id="start" class="control">Start</button>
    <button id="skip" class="control">Skip</button>
    </div>
    <p id="connection"></p>
    <p id="status"></p>
    <p id="audioStatus"></p>
    <h3 id="clients" class="control"></h3>
    <h3>Upcoming</h3>
    <div>
        <table id="compTable">
            <thead>
                <tr><th>name</th><th>time</th></tr>
            </thead>
            <tbody id="competitorList" class="control"></tbody>
        </table>
    </div>

    <!-- Modal -->
    <div id="endModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <p>Competition has ended!</p>
        </div>
    </div>

    <script type="module" src="/js/dj.js"></script>
</body>
</html>
