<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
      Judge Panel
    </title>
    <!-- <link rel="stylesheet" href="./lib/styles.css"> -->
    <style>
      body {
        background-color: #333;
        color: white;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
        margin: 1em;
      }

      p {
        font-size: 1.5em;
        text-align: center;
        margin: 0.5em;
      }

      .score {
        font-size: 2em;
        color: orange;
        text-align: center;
      }

      /* Sliders */
      .slider-group {
        padding: 0.8em;
      }

      .slider-group label {
        color: rgb(192, 192, 106);
        display: block;
        font-size: small;
      }

      #currentCompetitor {
        font-size: 2em;
        padding: 0.5em;
      }

      /* Custom Slider */
      .slider {
        -webkit-appearance: none;
        appearance: none;
        width: 80%;
        height: 6px;
        background: #555;
        border-radius: 5px;
        outline: none;
      }

      .slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 18px;
        height: 18px;
        background: orange;
        border-radius: 50%;
        cursor: pointer;
      }

      .slider::-moz-range-thumb {
        width: 18px;
        height: 18px;
        background: orange;
        border-radius: 50%;
        cursor: pointer;
      }

      button {
        padding: 0.6em;
        color: white;
        font-size: medium;
        border-radius: 10px;
        margin: 20px;
        background-color: #5c5957;
      }
    </style>
  </head>

  <body>
    <p id="judge" class="control">Judge</p>
    <p id="currentCompetition" class="control">Competition</p>

    <div id="currentCompetitor" class="control">Competitor 1</div>

    <div id="sliders" class="control"></div>

    <p id="status"></p>
    <button id="submit" class="control">Submit</button>
  </body>
  <script type="module" src="/js/jd.js"></script>
</html>
